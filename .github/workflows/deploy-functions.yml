# Deploys the Studio's Supabase server functions whenever they change (or when run by hand from the Actions tab).
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access tokens → Generate new token), in GitHub → Settings → Secrets and variables → Actions.
# The API keys the functions use (ANTHROPIC_API_KEY, STUDIO_PASSCODE, …) stay in Supabase; nothing secret is in this file.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nmbtgpipjdfcksrapasn
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          for fn in studio-ai-draft studio-research studio-media-upload studio-figma-source; do
            echo "Deploying $fn…"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
