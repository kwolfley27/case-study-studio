<!doctype html>
<html><head><meta charset="utf-8"><title>Record a flow</title>
<style>
  :root{--ink:#000;--paper:#fdfcfc;--taupe:#f5f3f1;--stone:#ebe8e4;--smoke:#777169;--ash:#a59f97;--spark:#ff4704}
  *{box-sizing:border-box}
  body{margin:0;width:320px;padding:18px;background:var(--paper);color:var(--ink);font:400 13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
  h1{margin:0 0 4px;font-weight:300;font-size:24px;letter-spacing:-.02em}
  p{margin:0;color:var(--smoke)}
  .status{display:flex;align-items:center;gap:8px;margin:12px 0 14px;font-size:12.5px;color:var(--smoke)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--stone)}
  .on .dot{background:var(--spark);animation:p 1.6s ease-in-out infinite}
  @keyframes p{50%{opacity:.3}}
  input{width:100%;padding:9px 12px;border:0;border-radius:10px;background:var(--taupe);font:inherit;margin-bottom:10px}
  button{height:38px;padding:0 16px;border-radius:9999px;font:500 13px/1 inherit;cursor:pointer}
  .primary{width:100%;border:0;background:var(--ink);color:var(--paper)}
  .ghost{border:1px solid #e5e5e5;background:var(--paper);color:var(--ink)}
  .row{display:flex;gap:6px;margin-top:8px}.row button{flex:1}
  button:disabled{opacity:.35;cursor:default}
  .strip{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px}
  .strip figure{margin:0;flex:none;width:64px}
  .strip img{width:64px;height:96px;object-fit:cover;object-position:top;border-radius:8px;box-shadow:0 0 0 1px var(--stone);display:block}
  .strip figcaption{font-size:10.5px;line-height:1.25;color:var(--smoke);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  small{display:block;margin-top:12px;color:var(--ash);font-size:11.5px}
</style></head>
<body>
  <h1>Record a flow</h1>
  <p>Click through the site as a user would. Each click becomes a step with a screenshot.</p>
  <div class="status" id="status"><i class="dot"></i><span id="state">Not recording</span></div>
  <input id="name" placeholder="Name, e.g. ClassPass · book a class">
  <button class="primary" id="toggle">Start recording this tab</button>
  <div class="strip" id="strip"></div>
  <div class="row"><button class="ghost" id="undo">Undo step</button><button class="ghost" id="clear">Clear</button></div>
  <div class="row"><button class="primary" id="send">Send to Studio</button></div>
  <div class="row"><button class="ghost" id="download">Download file</button></div>
  <small>Screenshots stay in this browser until you send them. Only the tab you start on is recorded.</small>
  <script src="popup.js"></script>
</body></html>
